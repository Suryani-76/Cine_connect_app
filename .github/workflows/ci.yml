name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Server ──────────────────────────────────────────────────────
  server:
    name: Server — type-check + test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
        env:
          # Tests use mocked Supabase — these are placeholders
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder-key

      - name: Build
        run: npm run build

  # ── Client ──────────────────────────────────────────────────────
  client:
    name: Client — type-check + test + build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
        env:
          VITE_API_URL: http://localhost:3000
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3000
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

  # ── Security & Secret Hygiene ───────────────────────────────────
  security:
    name: Security & Secret Hygiene (Audit + Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Server Dependency Audit
        run: |
          cd server && npm audit --audit-level=high || true

      - name: Client Dependency Audit
        run: |
          cd client && npm audit --audit-level=high || true

  # ── Docker build check ──────────────────────────────────────────
  docker:
    name: Docker — build check
    runs-on: ubuntu-latest
    needs: [server]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build server Docker image
        run: docker build -t cineconnect-server:ci ./server

  # ── Summary ─────────────────────────────────────────────────────
  summary:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [server, client, docker, security]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.server.result }}" != "success" || "${{ needs.client.result }}" != "success" || "${{ needs.docker.result }}" != "success" || "${{ needs.security.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI checks passed ✅"
