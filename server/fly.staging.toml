# Fly.io deployment config for CineConnect server (Staging)
# Deploy with: fly deploy --config server/fly.staging.toml
# Docs: https://fly.io/docs/reference/configuration/

app = "cineconnect-server-staging"
primary_region = "bom"  # Mumbai
kill_signal = "SIGTERM"
kill_timeout = "20s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "staging"

# Process Groups:
# app: Express API server
# email_worker: transactional outbox processor
# recompute_worker: match engine queue processor
[processes]
  app = "node dist/index.js"
  email_worker = "node dist/workers/emailWorker.js"
  recompute_worker = "node dist/workers/recomputeWorker.js"

# Secrets (set via: fly secrets set KEY=value --config server/fly.staging.toml)
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# ALLOWED_ORIGINS
# RESEND_API_KEY
# EMAIL_FROM
# APP_URL

[[services]]
  processes = ["app"]
  protocol = "tcp"
  internal_port = 3000
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
    protocol = "http"
    tls_skip_verify = false

[checks]
  [checks.health]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    port = 3000
    timeout = "5s"
    type = "http"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
